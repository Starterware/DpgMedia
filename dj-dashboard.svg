<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <clipPath id="outer"><rect x="0" y="0" width="1200" height="700" rx="18"/></clipPath>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="photoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#outer)">
    <rect x="0" y="0" width="1200" height="700" fill="#ffffff"/>

    <!-- ============ HEADER ============ -->
    <rect x="0" y="0" width="1200" height="56" fill="#0e0e10"/>
    <text x="24" y="34" font-size="18" font-weight="700" fill="#ffffff">🎙️ MORNING RUSH</text>
    <text x="180" y="34" font-size="12" fill="#8b8f96" font-family="Consolas, monospace">LIVE DASHBOARD</text>
    <circle cx="1096" cy="28" r="5" fill="#ff3b30"/>
    <text x="1108" y="33" font-size="13" font-weight="700" fill="#ff3b30" font-family="Consolas, monospace">ON AIR</text>

    <!-- ============ LEFT: STREAMING CHAT PANEL ============ -->
    <rect x="0" y="56" width="720" height="644" fill="#18181b"/>

    <rect x="0" y="56" width="720" height="34" fill="#0e0e10"/>
    <text x="16" y="78" font-size="13" font-weight="700" fill="#efeff1">💬 STREAM CHAT</text>
    <text x="150" y="78" font-size="12" font-weight="700" fill="#ff4757" font-family="Consolas, monospace">🔴 LIVE</text>
    <text x="210" y="78" font-size="11" fill="#adadb8" font-family="Consolas, monospace">👀 1,240 watching</text>

    <!-- Message 1: Sarah_M -->
    <circle cx="30" cy="118" r="14" fill="#22d3ee"/>
    <text x="30" y="122" font-size="11" font-weight="700" fill="#0e2a30" text-anchor="middle">S</text>
    <text x="52" y="122" font-size="13" fill="#e5e7eb">
      <tspan fill="#22d3ee" font-weight="700">Sarah_M:</tspan> Great show today Alex! Play some Weeknd next!
      <tspan fill="#6b7280" font-size="10" font-family="Consolas, monospace" dx="6">09:41</tspan>
    </text>

    <!-- Message 2: Dave_K highlight -->
    <rect x="8" y="148" width="704" height="34" rx="6" fill="#1f1b0f" stroke="#ffd700" stroke-width="1"/>
    <circle cx="30" cy="165" r="14" fill="#ffd700"/>
    <text x="30" y="169" font-size="11" font-weight="700" fill="#4a3b00" text-anchor="middle">D</text>
    <text x="52" y="169" font-size="13" fill="#f3e5b3">
      <tspan fill="#ffd700" font-weight="700">Dave_K:</tspan> Happy 5th Anniversary to the Morning Rush team! 🎉
      <tspan fill="#8a7c4a" font-size="10" font-family="Consolas, monospace" dx="6">09:42</tspan>
    </text>

    <!-- Message 3: Mike_88 voice note -->
    <circle cx="30" cy="205" r="14" fill="#4ade80"/>
    <text x="30" y="209" font-size="11" font-weight="700" fill="#0f3d1f" text-anchor="middle">M</text>
    <text x="52" y="209" font-size="13" fill="#e5e7eb"><tspan fill="#4ade80" font-weight="700">Mike_88:</tspan> 🌊 0:14 ▶ Play</text>
    <text x="52" y="227" font-size="12.5" font-style="italic" fill="#c9d1d9">'Hey DJ, loved the segment on local bands...'
      <tspan fill="#6b7280" font-size="10" font-style="normal" font-family="Consolas, monospace" dx="6">09:43</tspan>
    </text>

    <!-- Message 4: Elena_R highlight -->
    <rect x="8" y="252" width="704" height="34" rx="6" fill="#1a1625" stroke="#c084fc" stroke-width="1"/>
    <circle cx="30" cy="269" r="14" fill="#c084fc"/>
    <text x="30" y="273" font-size="11" font-weight="700" fill="#2e1a45" text-anchor="middle">E</text>
    <text x="52" y="273" font-size="13" fill="#e4d4fb">
      <tspan fill="#c084fc" font-weight="700">Elena_R:</tspan> Can you give a shoutout to the Tervuren Running Club?
      <tspan fill="#8a7ca0" font-size="10" font-family="Consolas, monospace" dx="6">09:44</tspan>
    </text>

    <!-- Message 5: Tom_B with inline photo -->
    <circle cx="30" cy="316" r="14" fill="#fb923c"/>
    <text x="30" y="320" font-size="11" font-weight="700" fill="#4a2200" text-anchor="middle">T</text>
    <text x="52" y="320" font-size="13" fill="#e5e7eb">
      <tspan fill="#fb923c" font-weight="700">Tom_B:</tspan> Listening from the office!
      <tspan fill="#6b7280" font-size="10" font-family="Consolas, monospace" dx="6">09:45</tspan>
    </text>
    <rect x="52" y="332" width="150" height="78" rx="8" fill="url(#photoGrad)"/>
    <circle cx="72" cy="352" r="9" fill="#fff7d6"/>
    <path d="M52 396 L92 362 L118 384 L142 358 L202 396 Z" fill="#c2410c" opacity="0.85"/>

    <!-- Message 6: Priya_L -->
    <circle cx="30" cy="440" r="14" fill="#f472b6"/>
    <text x="30" y="444" font-size="11" font-weight="700" fill="#4a0e2e" text-anchor="middle">P</text>
    <text x="52" y="444" font-size="13" fill="#e5e7eb">
      <tspan fill="#f472b6" font-weight="700">Priya_L:</tspan> Same, been listening since 7am 🙌
      <tspan fill="#6b7280" font-size="10" font-family="Consolas, monospace" dx="6">09:46</tspan>
    </text>

    <!-- Message 7: Host reply -->
    <circle cx="30" cy="486" r="14" fill="#9147ff"/>
    <text x="30" y="490" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="52" y="490" font-size="13" fill="#e5e7eb">
      <tspan fill="#c9a7ff" font-weight="700">Alex_J (Host):</tspan> Thanks everyone, keep the requests coming! 🔥
      <tspan fill="#6b7280" font-size="10" font-family="Consolas, monospace" dx="6">09:47</tspan>
    </text>

    <!-- Scroll hint -->
    <rect x="284" y="612" width="152" height="24" rx="12" fill="#9147ff"/>
    <text x="360" y="628" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">▼ 3 new messages</text>

    <!-- Chat input bar -->
    <rect x="0" y="646" width="720" height="54" fill="#0e0e10"/>
    <rect x="16" y="662" width="600" height="24" rx="12" fill="#26262c" stroke="#3a3a40"/>
    <text x="30" y="678" font-size="12" fill="#71717a">Send a message...</text>
    <rect x="628" y="662" width="76" height="24" rx="12" fill="#9147ff"/>
    <text x="666" y="678" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Chat</text>

    <!-- ============ RIGHT: DASHBOARD MODULES ============ -->
    <rect x="720" y="56" width="480" height="644" fill="#f7f8fa"/>

    <!-- Card A: AI Summary (text, last 5 min) -->
    <rect x="736" y="72" width="448" height="200" rx="8" fill="#ffffff" stroke="#e3eefb" filter="url(#cardShadow)"/>
    <rect x="736" y="72" width="4" height="200" fill="#1565c0"/>
    <text x="752" y="96" font-size="13" font-weight="700" fill="#0d47a1">🤖 AI SUMMARY · LAST 5 MIN</text>
    <text x="752" y="120" font-size="12" fill="#37474f">The last 5 minutes have been upbeat and</text>
    <text x="752" y="138" font-size="12" fill="#37474f">celebratory. Dave_K's 5-year listener</text>
    <text x="752" y="156" font-size="12" fill="#37474f">anniversary sparked goodwill across chat,</text>
    <text x="752" y="174" font-size="12" fill="#37474f">while others request 80s throwbacks and</text>
    <text x="752" y="192" font-size="12" fill="#37474f">Weeknd. Mike_88 shared a voice note on the</text>
    <text x="752" y="210" font-size="12" fill="#37474f">local music scene. Overall mood: high energy,</text>
    <text x="752" y="228" font-size="12" fill="#37474f">friendly, and engaged.</text>
    <text x="752" y="254" font-size="10" fill="#90a4ae">Refreshes automatically every 5 minutes</text>

    <!-- Card B: Live Poll -->
    <rect x="736" y="296" width="448" height="160" rx="8" fill="#ffffff" stroke="#f0e3f7" filter="url(#cardShadow)"/>
    <rect x="736" y="296" width="4" height="160" fill="#7b1fa2"/>
    <text x="752" y="320" font-size="13" font-weight="700" fill="#4a148c">📊 LIVE POLL RESULTS</text>
    <text x="752" y="340" font-size="11" fill="#8e63a8">Favorite 80s Anthem?</text>
    <rect x="752" y="354" width="192" height="18" fill="#7b1fa2"/>
    <rect x="944" y="354" width="128" height="18" fill="#ab47bc"/>
    <rect x="1072" y="354" width="80" height="18" fill="#e1bee7"/>
    <text x="752" y="392" font-size="11" fill="#4a148c" font-family="Consolas, monospace">■ Take On Me 48%   ■ Sweet Dreams 32%</text>
    <text x="752" y="410" font-size="11" fill="#4a148c" font-family="Consolas, monospace">■ Blue Monday 20%</text>
    <text x="752" y="436" font-size="10" fill="#a084b8">1,860 votes cast</text>

    <!-- Card C: Filters -->
    <rect x="736" y="480" width="448" height="92" rx="8" fill="#ffffff" stroke="#e6e6e6" filter="url(#cardShadow)"/>
    <rect x="736" y="480" width="4" height="92" fill="#616161"/>
    <text x="752" y="504" font-size="13" font-weight="700" fill="#212121">🔍 TOPIC SEARCH &amp; FILTERS</text>

    <rect x="752" y="516" width="42" height="24" rx="12" fill="#eceff1" stroke="#bdbdbd"/>
    <text x="773" y="532" font-size="10.5" fill="#424242" text-anchor="middle">All</text>

    <rect x="802" y="516" width="80" height="24" rx="12" fill="#eceff1" stroke="#bdbdbd"/>
    <text x="842" y="532" font-size="10.5" fill="#424242" text-anchor="middle">🎙️ Voice</text>

    <rect x="890" y="516" width="66" height="24" rx="12" fill="#eceff1" stroke="#bdbdbd"/>
    <text x="923" y="532" font-size="10.5" fill="#424242" text-anchor="middle">🌟 VIPs</text>

    <rect x="964" y="516" width="96" height="24" rx="12" fill="#eceff1" stroke="#bdbdbd"/>
    <text x="1012" y="532" font-size="10.5" fill="#424242" text-anchor="middle">🎵 Requests</text>

    <text x="752" y="654" font-size="10" fill="#b0b8bd">Morning Rush · auto-updated dashboard</text>
  </g>

  <rect x="1" y="1" width="1198" height="698" rx="17" fill="none" stroke="#d5d9dc"/>
</svg>
